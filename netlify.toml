# Netlify の設定
# tsumtsum/dist/ にできあがった静的サイト（オフラインで遊べる PWA）を公開する。
# ビルドは不要（dist/ はリポジトリに入っています）。
# 作りなおすときは手元で `cd tsumtsum && make static` を実行してコミットしてください。

[build]
  publish = "tsumtsum/dist"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
