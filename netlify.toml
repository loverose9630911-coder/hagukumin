# Netlify の設定（このファイルは「ぞうさんとなかまたち」のサイト用）
#
# このリポジトリには 2 つのアプリが入っていて、Netlify のサイトも 2 つに分けています。
#
#   ぞうさんとなかまたち（ツムツム風パズル） … このファイル。tsumtsum/dist/ を公開
#   すうじとなかまたち（数字なぞり・ひらがな） … suuji-nazori/netlify.toml。
#                                              サイト側で Base directory を
#                                              suuji-nazori に設定してください
#
# ★ここを別のフォルダに書きかえると、ぞうさんのサイトが
#   まるごと別のアプリに差しかわります（iPad のアイコンはそのままで中身だけ変わります）。
#   アプリを増やすときは、このファイルを書きかえるのではなく
#   Netlify のサイトを追加して、そのフォルダに netlify.toml を置いてください。
#
# ビルドは不要です（dist/ はリポジトリに入っています）。
# 中身を変えたときは、手元で `cd tsumtsum && make static` を実行してコミットしてください。

[build]
  publish = "tsumtsum/dist"

# index.html と Service Worker はキャッシュさせない（更新がすぐ反映されるように）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# 画像・CSS・JS は Service Worker が持つので長めに
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
