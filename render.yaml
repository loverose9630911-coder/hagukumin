# Render に置くときの設定
#
#   1. https://dashboard.render.com/ → New → Blueprint
#   2. このリポジトリを選ぶ
#   3. Blueprint Name に好きな名前を入れる（例: hagukumin）※ここは必須です
#   4. Apply
#
# ─────────────────────────────────────────────────────────────
# 【大事】無料プランでは「ディスク」が使えません
# ─────────────────────────────────────────────────────────────
# Render の無料プランに disk: を書くと
#   「disks are not supported for free tier services」
# と言われて Apply が止まります。そのため、この設定では disk: を外しています。
#
# その代わり、無料プランには次の性質があります。
#   ・15 分アクセスがないと眠り、次にひらくとき 30〜60 秒待たされます
#   ・眠って起き直すと、保存したデータは消えます（お試し用と思ってください）
#
# ■ データを残したい（実際に業務で使う）場合
#   下の各サービスで、
#     plan: free  →  plan: starter        （有料。1サービスあたり月 7 ドル程度）
#   に変えたうえで、そのサービスの末尾に disk: の 4 行を足してください。
#   書き方は各サービスのコメントに載せてあります。

services:
  # ぞうさんとなかまたち（ツムツム風パズル）
  - type: web
    name: zousan-game
    runtime: docker
    dockerfilePath: ./tsumtsum/Dockerfile
    dockerContext: ./tsumtsum
    plan: free
    region: singapore
    healthCheckPath: /index.php
    envVars:
      - key: PORT
        value: 8080
      - key: PHP_CLI_SERVER_WORKERS
        value: 4
    # コイン・所持キャラ・ランキングを残したい場合は plan を starter にして、
    # 次の4行のコメントを外してください。
    # disk:
    #   name: data
    #   mountPath: /app/data
    #   sizeGB: 1

  # ミカタ（チームと個人のタスクを1枚で見るアプリ）
  - type: web
    name: mikata
    runtime: docker
    dockerfilePath: ./mikata/Dockerfile
    dockerContext: ./mikata
    plan: free
    region: singapore
    healthCheckPath: /api/me
    envVars:
      - key: PORT
        value: 8080
      - key: MIKATA_TZ
        value: Asia/Tokyo
      - key: PHP_CLI_SERVER_WORKERS
        value: 4
      # 中身が空のときだけデモデータを入れて、開いてすぐ触れる状態にする。
      # （ログイン: demo / demo1234）
      # 実際に業務で使うときは、この2行を消すか value を空にしてください。
      - key: MIKATA_SEED
        value: 1
    # タスク・会話・目標を残したい場合は plan を starter にして、
    # 次の4行のコメントを外し、上の MIKATA_SEED は消してください。
    # disk:
    #   name: mikata-data
    #   mountPath: /app/data
    #   sizeGB: 1

  # canter（つくって、そのまま出すデザイン道具）
  - type: web
    name: canter
    runtime: docker
    dockerfilePath: ./canter/Dockerfile
    dockerContext: ./canter
    plan: free
    region: singapore
    healthCheckPath: /api/me
    envVars:
      - key: PORT
        value: 8080
      - key: CANTER_TZ
        value: Asia/Tokyo
      - key: PHP_CLI_SERVER_WORKERS
        value: 4
      # ★ここが大事★
      # Instagram・Threads・Notion は「画像の URL」を受け取って取りに来る作りなので、
      # canter が外から見えるアドレスを知っている必要があります。
      # Apply して払い出されたアドレス（https://canter-xxxx.onrender.com）を、
      # Render の Environment 画面でここに入れ直してください。
      # 入れないと、この3つには画像を渡せません（X とミカタは入れなくても出せます）。
      - key: CANTER_PUBLIC_URL
        sync: false
      # 外部サービスのトークンを暗号化する鍵。
      # 入れないと data/secret.key が使われますが、ディスクの無い無料プランでは
      # 眠って起き直すたびに鍵が変わり、保存した接続設定が読めなくなります。
      - key: CANTER_SECRET
        generateValue: true
      # 中身が空のときだけデモデータを入れて、開いてすぐ触れる状態にする。
      # （ログイン: demo / demo1234）
      # 実際に業務で使うときは、この2行を消すか value を空にしてください。
      - key: CANTER_SEED
        value: 1
    # デザイン・画像・接続設定を残したい場合は plan を starter にして、
    # 次の4行のコメントを外し、上の CANTER_SEED は消してください。
    # disk:
    #   name: canter-data
    #   mountPath: /app/data
    #   sizeGB: 1
