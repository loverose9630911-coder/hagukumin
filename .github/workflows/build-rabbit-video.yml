name: Build Rabbit Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/animal-character-personification-vi6pee

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Download clips (V-0 narration + 7 regenerated Wan 2.7 lipsync videos)
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3FXRw0QbkyIIBK4oAfto9a5HESB"
          # V-0 narration (unchanged kling)
          curl -fsSL -o v0.mp4 "$BASE/hf_20260630_144815_2a21e734-1636-46a8-8404-760168646734.mp4"
          # B-0 narration audio
          curl -fsSL -o b0.wav "$BASE/hf_20260630_144054_75429b2a-a172-48b7-9ed5-190af18a5b93.wav"
          # V-1..V-6 NEW (character-locked Wan 2.7 regeneration)
          curl -fsSL -o v1.mp4  "$BASE/hf_20260630_213408_bd6fc891-c641-4cdb-8e84-fe8c871915ea.mp4"
          curl -fsSL -o v2.mp4  "$BASE/hf_20260630_213415_e7372d8e-2242-42bc-842f-739c2f503c5f.mp4"
          curl -fsSL -o v3.mp4  "$BASE/hf_20260630_213420_b095ee40-69b6-4e3a-b653-2bd18d02adef.mp4"
          curl -fsSL -o v4.mp4  "$BASE/hf_20260630_213426_7a5858f2-e7eb-42da-8fa0-c5ff3b90c680.mp4"
          curl -fsSL -o v5a.mp4 "$BASE/hf_20260630_213432_f2f0b9fb-b8da-4c1d-99ca-644f09e640fb.mp4"
          curl -fsSL -o v5b.mp4 "$BASE/hf_20260630_213436_8e086764-bc2c-4de2-b95b-22059557e7e0.mp4"
          curl -fsSL -o v6.mp4  "$BASE/hf_20260630_213442_456cf566-ad7f-4f66-abb6-93921c79b83c.mp4"
          ls -la

      - name: Attach narration to V-0
        run: |
          set -euo pipefail
          cd work
          ffmpeg -y -i v0.mp4 -i b0.wav \
            -filter_complex "[1:a]apad=pad_dur=10[a]" \
            -map 0:v -map "[a]" -shortest \
            -c:v copy -c:a aac -b:a 192k \
            v0_audio.mp4

      - name: Normalize all clips to 1280x720 30fps h264 aac
        run: |
          set -euo pipefail
          cd work
          for f in v0_audio v1 v2 v3 v4 v5a v5b v6; do
            ffmpeg -y -i "${f}.mp4" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30" \
              -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -ar 48000 -ac 2 \
              "${f}_norm.mp4"
          done
          ls -la *_norm.mp4

      - name: Concatenate
        run: |
          set -euo pipefail
          cd work
          cat > list.txt <<EOF
          file 'v0_audio_norm.mp4'
          file 'v1_norm.mp4'
          file 'v2_norm.mp4'
          file 'v3_norm.mp4'
          file 'v4_norm.mp4'
          file 'v5a_norm.mp4'
          file 'v5b_norm.mp4'
          file 'v6_norm.mp4'
          EOF
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../momo_rabbit_intro.mp4
          ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 ../momo_rabbit_intro.mp4
          ls -la ../momo_rabbit_intro.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: momo_rabbit_intro
          path: momo_rabbit_intro.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Create / update release with the mp4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="rabbit-video-latest"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" momo_rabbit_intro.mp4 \
            --title "うさぎのもも 自己紹介動画" \
            --notes "Auto-built by Actions. Download momo_rabbit_intro.mp4 and upload to YouTube as-is."
