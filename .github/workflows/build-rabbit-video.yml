name: Build Rabbit Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (required for gh release)
        uses: actions/checkout@v4

      - name: Download 6 vertical summer shorts (9:16)
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3FXRw0QbkyIIBK4oAfto9a5HESB"
          curl -fsSL -o 01_usachan_engawa_suika.mp4    "$BASE/hf_20260718_230934_712466df-0b85-4765-90f3-c7f1e30a74f3.mp4"
          curl -fsSL -o 02_zoukun_asagao_mizuyari.mp4  "$BASE/hf_20260718_230937_4572f7b0-f893-4d52-aba6-4d0148c03072.mp4"
          curl -fsSL -o 03_kapibara_kawa_ukiwa.mp4     "$BASE/hf_20260718_230940_636ca566-3744-47ad-b19f-46f1cab579db.mp4"
          curl -fsSL -o 04_panpan_ramune.mp4           "$BASE/hf_20260718_230943_383bea41-d5d5-418c-9a15-f70a49ae8ed3.mp4"
          curl -fsSL -o 05_beaver_kawazuri.mp4         "$BASE/hf_20260718_230946_cdda7cb8-0156-4dc8-8d65-fa236fa2dc55.mp4"
          curl -fsSL -o 06_kirinsan_yuyake_beach.mp4   "$BASE/hf_20260718_230949_45a54510-551e-46d8-9506-ffa19d9d7664.mp4"
          ls -la

      - name: Create / update release with the 6 mp4 files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="summer-9x16-20260719"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" \
            work/01_usachan_engawa_suika.mp4 \
            work/02_zoukun_asagao_mizuyari.mp4 \
            work/03_kapibara_kawa_ukiwa.mp4 \
            work/04_panpan_ramune.mp4 \
            work/05_beaver_kawazuri.mp4 \
            work/06_kirinsan_yuyake_beach.mp4 \
            --title "夏ショート動画 縦9:16 6本（2026-07-19）" \
            --notes "YouTubeショート用 縦9:16・10秒・音声なし。1本ずつ個別にダウンロードできます。ファイル名対応: 01=うさーちゃんの縁側スイカ / 02=ぞうくんの朝顔みずやり / 03=カピバラさんの川うきわ / 04=ぱんぱんのラムネ / 05=ビーバーさんの川釣り / 06=きりんさんの夕焼けビーチ"
