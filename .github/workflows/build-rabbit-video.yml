name: Build Rabbit Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Download canonical Usa-chan image + 8 MiniMax audio tracks
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3FXRw0QbkyIIBK4oAfto9a5HESB"
          # Single canonical character image (used in EVERY scene → zero character drift)
          curl -fsSL -o usa.png  "$BASE/hf_20260630_221848_d4210ab1-7fc2-4de4-8d3c-663337d56334.png"
          # 8 audio segments (MiniMax / natural Japanese)
          curl -fsSL -o b0.mp3   "$BASE/hf_20260630_221851_67df1408-1b1a-4647-885d-6bbf1c6f185b.mp3"
          curl -fsSL -o b1.mp3   "$BASE/hf_20260630_221853_795e2dec-53db-4a3d-9598-9e531e2ef482.mp3"
          curl -fsSL -o b2.mp3   "$BASE/hf_20260630_221855_42026006-edbc-4eb2-a6a5-42124a894c1f.mp3"
          curl -fsSL -o b3.mp3   "$BASE/hf_20260630_221857_5c7bd388-aa5d-4a0c-b747-ccec08dc9513.mp3"
          curl -fsSL -o b4.mp3   "$BASE/hf_20260630_221900_de3a592b-aba3-46f9-85c3-78badc30342a.mp3"
          curl -fsSL -o b5a.mp3  "$BASE/hf_20260630_221902_6ef45ce7-5e72-4042-bd8a-eaca33fc97ee.mp3"
          curl -fsSL -o b5b.mp3  "$BASE/hf_20260630_221905_24ef1398-5b1c-40df-9afb-6ccfc201efae.mp3"
          curl -fsSL -o b6.mp3   "$BASE/hf_20260630_221908_e551dd37-f48e-4091-b4c1-b9728647af91.mp3"
          ls -la

      - name: Build 8 slideshow segments (same image + each audio + subtle Ken Burns)
        run: |
          set -euo pipefail
          cd work
          # Pre-scale source image once to a hi-res working canvas so zoompan stays sharp
          ffmpeg -y -i usa.png -vf "scale=2560:1440:force_original_aspect_ratio=decrease,pad=2560:1440:(ow-iw)/2:(oh-ih)/2:white" hi.png

          build_segment() {
            local audio="$1"
            local out="$2"
            local zoom_dir="$3"   # in | out | left | right
            local dur
            dur=$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$audio")
            # Number of output frames = duration * 30
            local frames
            frames=$(python3 -c "import math; print(max(60, int(math.ceil(${dur}*30))))")
            local zexpr xexpr yexpr
            case "$zoom_dir" in
              in)    zexpr="min(zoom+0.0008,1.20)"; xexpr="iw/2-(iw/zoom/2)";       yexpr="ih/2-(ih/zoom/2)" ;;
              out)   zexpr="if(lte(zoom,1.0),1.20,max(zoom-0.0008,1.00))"; xexpr="iw/2-(iw/zoom/2)"; yexpr="ih/2-(ih/zoom/2)" ;;
              left)  zexpr="1.12"; xexpr="(iw-iw/zoom)*on/${frames}"; yexpr="ih/2-(ih/zoom/2)" ;;
              right) zexpr="1.12"; xexpr="iw-iw/zoom-((iw-iw/zoom)*on/${frames})"; yexpr="ih/2-(ih/zoom/2)" ;;
            esac
            ffmpeg -y -loop 1 -framerate 30 -i hi.png -i "$audio" \
              -filter_complex "[0:v]zoompan=z='${zexpr}':x='${xexpr}':y='${yexpr}':d=1:s=1280x720:fps=30,format=yuv420p[v]" \
              -map "[v]" -map 1:a \
              -t "$dur" \
              -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -ar 48000 -ac 2 \
              -shortest "$out"
          }

          build_segment b0.mp3  s0.mp4 in
          build_segment b1.mp3  s1.mp4 in
          build_segment b2.mp3  s2.mp4 left
          build_segment b3.mp3  s3.mp4 right
          build_segment b4.mp3  s4.mp4 left
          build_segment b5a.mp3 s5.mp4 in
          build_segment b5b.mp3 s6.mp4 out
          build_segment b6.mp3  s7.mp4 out
          ls -la s*.mp4

      - name: Concatenate
        run: |
          set -euo pipefail
          cd work
          cat > list.txt <<EOF
          file 's0.mp4'
          file 's1.mp4'
          file 's2.mp4'
          file 's3.mp4'
          file 's4.mp4'
          file 's5.mp4'
          file 's6.mp4'
          file 's7.mp4'
          EOF
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../usa_chan_intro.mp4
          ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 ../usa_chan_intro.mp4
          ls -la ../usa_chan_intro.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usa_chan_intro
          path: usa_chan_intro.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Create / update release with the mp4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="rabbit-video-latest"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" usa_chan_intro.mp4 \
            --title "うさちゃん 自己紹介動画" \
            --notes "Slideshow build: single canonical character image + MiniMax Japanese narration + Ken Burns motion. Upload to YouTube as-is."
