<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ミカタ">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="shine" cx="16" cy="10" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>

  <!-- 外側のリング＝チーム。薄いほうが全体、濃いほうが進んだぶん -->
  <g transform="rotate(-90 32 32)" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="20" stroke="#fff" stroke-opacity=".24" stroke-width="8"/>
    <circle cx="32" cy="32" r="20" stroke="#fff" stroke-width="8" stroke-dasharray="80 45.66"/>
  </g>

  <!-- 真ん中の点＝その中にいる自分 -->
  <circle cx="32" cy="32" r="6.5" fill="#fff"/>
</svg>
